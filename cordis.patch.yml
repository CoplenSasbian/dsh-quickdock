# QuickDock is a bundle: this file inserts the plugin rows DSH mounts.
#
# The row named after the package is mandatory, not decoration. DSH builds the
# Web page's client-module roster from the rows a bundle declares, and the client
# bundle (the header Dock button) is resolved from the row whose name is the
# package name. An empty patch mounts nothing: no Host, no client module, no
# button. That is why this list is `[]` only when the plugin is meant to be off.
#
# One row mounts both components (the shell listener + the Electron window); set
# `config.dock: false` to serve the shell page headlessly without a window.
- insert:
    - id: dsh-quickdock
      name: dsh-quickdock
      config:
        enabled: true
        # Keep the dock on demand: Electron starts on the first click.
        autoLaunch: false
        # Fetch the desktop runtime at mount so the first click is instant.
        prefetchElectron: true
        # The header button this row's client bundle registers.
        headerButton: true
        headerButtonOrder: 1010
        # Dock-shaped window, sized for the full Web UI.
        width: 460
        inputHeight: 820
        # The embedded app posts no hit regions: keep the window clickable.
        clickThrough: false
        # Close stays with the OS; minimise is our own button (collapse into the
        # floating whale ball), so the platform must not draw a minimise.
        windowControls: system
