# QuickDock ships three rows in DSH's plugin list:
#
#   dsh-quickdock     - the package row. It mounts nothing, but it is the row
#                       that carries the client bundle: DSH's client-modules
#                       scan resolves `<row name>/package.json`, so a row whose
#                       name is exactly the package name is the ONLY way the
#                       header Dock button reaches the page. Delete this row and
#                       the button silently disappears while everything else
#                       keeps working.
#   quickdock-service - the Host API: routes, SSE, folds, interactions. No Electron.
#   quickdock-dock    - the windows, attached to that service.
#
# The package row must come first: it is what the two component rows hang off,
# and it is the switch that hides the button for every session.
#
# Disabling the dock leaves a headless API server (IDE clients, scripts, no
# Electron). Disabling the service takes the API away; the dock row then warns and
# stays inert.
- insert:
    - id: dsh-quickdock
      name: dsh-quickdock
      config: {}
    - id: quickdock-service
      name: dsh-quickdock/service
      config: {}
    - id: quickdock-dock
      name: dsh-quickdock/dock
      config: {}
