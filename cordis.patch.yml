# dsh-quickdock bundle patch: mounts the Host half into the profile plugin tree.
# Keys must match the Config schema in index.js (stale keys silently do nothing).
- insert:
    - id: dsh-quickdock
      name: dsh-quickdock
      config:
        enabled: true
        # On demand: Electron starts on the first Dock click and exits with the window.
        # Set true to stay resident (close only hides; no start-up latency).
        autoLaunch: false
        # Content width shared by both windows.
        width: 480
        # Fixed heights: input window and run window are separate windows.
        inputHeight: 172
        displayHeight: 520
        margin: 16
        rememberGeometry: true
        alwaysOnTop: false
        focusOnSummon: false
        hideOnEscape: true
        followBoundOnly: true
        defaultWorkspaceId: ""
        agentPreset: ""
        submitMode: queue
        thinkMode: fold
        showTiming: true
        maxSteps: 200
        theme: auto
        locale: auto
        headerButton: true
        headerButtonOrder: 1010
        approvalTimeoutMs: 300000
