# QuickDock ships the windows as their own row, on top of the package row:
#
#   dsh-quickdock      - the package row: the Host API (routes, SSE, folds,
#                        interactions) and the client bundle that draws the Dock
#                        button. Active at start-up, no Electron.
#   quickdock-dock     - the windows: Electron supervisor, page renderer, window
#                        commands. Switch it off for a headless API server.
#
# The dock is inserted here rather than mounted by the package row so DSH can
# switch it on and off without taking the API (and the button) down with it.
- insert:
    - id: quickdock-dock
      name: dsh-quickdock/dock
      config: {}
