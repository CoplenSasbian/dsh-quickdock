<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src data:;">
  <title>QuickDock</title>
  <!-- Host-inlined assets: theme tokens, style sheet, locale catalog, scripts. -->
  <!--QD_STYLES-->
  <!--QD_THEME-->
  <!--QD_I18N-->
</head>
<body>
  <!--
    Input window: fixed size, draggable.
    The run log lives in a separate window (display.html) attached above or
    below this one, so neither window resizes while content grows.
  -->
  <main id="dock" class="stack" aria-label="QuickDock">
    <!--
      The agent's task list, docked to the top of this window: it sits between
      the run window and the composer, so progress is visible while typing.
    -->
    <!-- Unified layout: the docked pane lives inside this window. -->
    <div class="display-pane" id="displayPane">
      <iframe id="displayFrame" title="Execution"></iframe>
    </div>
    <div class="todo-card" id="todoCard" hidden>
      <div class="todo-head" id="todoHead" role="button" tabindex="0">
        <span class="todo-icon" aria-hidden="true">☰</span>
        <span class="todo-title" data-i18n="todo.title">Tasks</span>
        <span class="todo-build" id="todoBuild"></span>
        <span class="todo-count" id="todoCount"></span>
        <span class="todo-chevron" aria-hidden="true">▾</span>
      </div>
      <div class="todo-goal" id="todoGoal" hidden><span class="todo-goal-mark" aria-hidden="true">◎</span><span id="todoGoalText"></span></div>
      <div class="todo-list" id="todoList"></div>
    </div>
    <section id="panelA" class="panel" data-i18n-aria-label="bar.inputPanel">
      <!--
        One row: session title + read-only workspace chip + status dot + actions.
        Which session is bound is decided in DSH (header Dock button), not here.
      -->
      <div class="bar">
        <span class="sess-title blank" id="sessTitle" data-i18n="bar.connecting">Connecting…</span>
        <span class="sess-meta" id="sessMeta"></span>
        <span class="ws-chip" data-i18n-title="bar.workspaceTitle"><span class="pk-icon">▣</span><span class="pk-name" id="wsName" data-i18n="bar.workspace">Workspace</span></span>
        <span class="bar-spacer"></span>
        <button class="icon-btn" id="openBtn" data-i18n-title="bar.openInDsh" data-i18n-aria-label="bar.openInDsh">↗</button>
        <button class="icon-btn" id="reloadBtn" data-i18n-title="bar.reload" data-i18n-aria-label="bar.reload" title="Reload">⟳</button>
        <button class="icon-btn" id="listBtn" data-i18n-title="bar.toggleList" data-i18n-aria-label="bar.toggleListLabel" aria-pressed="true">▤</button>
        <button class="icon-btn" id="newBtn" data-i18n-title="bar.newSession" data-i18n-aria-label="bar.newSessionLabel">＋</button>
        <button class="icon-btn" id="pinBtnA" data-i18n-title="bar.pin" data-i18n-aria-label="bar.pin" aria-pressed="false">⤒</button>
        <button class="icon-btn" id="hideBtnA" data-i18n-title="bar.close" data-i18n-aria-label="bar.close">✕</button>
      </div>
      <!--
        One line naming the tool the agent is running, in DSH's own shape:
        label - tool name (when it is an MCP/unknown tool) - arguments.
      -->
      <div id="runLine" class="run-line hidden" aria-live="polite">
        <span class="rl-dot" id="runDot" aria-hidden="true"></span>
        <span class="rl-figure" aria-hidden="true">✦</span>
        <span class="rl-label" id="runLineLabel"></span>
        <span class="rl-name" id="runLineName" hidden></span>
        <span class="rl-args" id="runLineArgs" hidden></span>
        <button class="stop-btn" id="stopBtnRun" data-i18n-title="run.stop" data-i18n-aria-label="run.stop"><span class="sq"></span></button>
      </div>
      <!--
        Composer mount: the island draws the text box, the function keys and the
        send button with the DSH primitives, so it matches the main window.
      -->
      <!-- In-place approval: answering never leaves the window. -->
      <div class="run-approval" id="runApproval" hidden>
        <div class="ra-head"><span class="ra-icon">⚠</span><span data-i18n="card.needConfirm">Needs confirmation</span><span class="ra-tool" id="runApprovalTool"></span></div>
        <div class="ra-reason" id="runApprovalReason"></div>
        <div class="ra-actions">
          <button class="card-btn primary" id="runAllow" data-i18n="card.allow">Allow</button>
          <button class="card-btn danger" id="runDeny" data-i18n="card.deny">Deny</button>
        </div>
      </div>
      <!--
        Questions from the agent. They live here, not in the docked window: that
        window can be hidden, and an unanswered question must never be invisible.
        One question at a time - picking an option must not answer the rest.
      -->
      <div class="ask-card" id="askCard" hidden role="group" aria-live="polite">
        <div class="ask-head">
          <span class="ask-icon" aria-hidden="true">?</span>
          <span class="ask-title" id="askTitle" data-i18n="card.question">Question</span>
          <span class="ask-step" id="askStep"></span>
        </div>
        <div class="ask-q" id="askQuestionText"></div>
        <div class="ask-options" id="askOptions"></div>
        <textarea class="ask-input" id="askInput" rows="2" hidden></textarea>
        <div class="ask-actions">
          <button class="card-btn" type="button" id="askBack" data-i18n="ask.back">Back</button>
          <button class="card-btn primary" type="button" id="askNext" data-i18n="ask.next">Next</button>
        </div>
      </div>
      <div class="composer-wrap">
        <div id="composerHost"></div>
      </div>
    </section>

  </main>
  <div class="menu" id="menu" role="menu" data-i18n-aria-label="menu.menuLabel"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="modal-backdrop" id="confirm" hidden>
    <section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <div class="confirm-title" id="confirmTitle" data-i18n="confirm.title">Enable full access?</div>
      <p id="confirmText" data-i18n="confirm.text">The agent will be able to read and modify files and run commands outside the workspace.</p>
      <div class="confirm-actions"><button class="card-btn" id="confirmCancel" data-i18n="confirm.cancel">Cancel</button><button class="card-btn danger" id="confirmOk" data-i18n="confirm.ok">Enable full access</button></div>
    </section>
  </div>
  <script>window.__QD_VIEW__ = 'input';</script>
  <!--QD_SCRIPT-->
</body>
</html>
