<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src data:;">
  <title>QuickDock Display</title>
  <!--QD_STYLES-->
  <!--QD_THEME-->
  <!--QD_I18N-->
</head>
<body class="display-body">
  <!--
    Run window: attached above or below the input window.
    #blocks is both the panel and the scroll container: it shrinks to its
    content and caps at the window height, so the rounded corners always stay
    on screen while the rows scroll inside.
  -->
  <div id="blocks" class="blocks" role="log" data-i18n-aria-label="display.logLabel">
    <!-- No title bar or buttons: this window only shows the run itself. -->
    <!-- Step rows: renderDisplay() only replaces children of this node. -->
    <div id="drows" class="drows"></div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>window.__QD_VIEW__ = 'display';</script>
  <!--QD_SCRIPT-->
</body>
</html>
